<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Timezone Converter</title>
		<script src="https://cdn.tailwindcss.com"></script>
		<style>
			body {
				font-family:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			}
			.fade-in {
				animation: fadeIn 0.3s ease-in;
			}
			@keyframes fadeIn {
				from {
					opacity: 0;
					transform: translateY(-5px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}
		</style>
	</head>
	<body
		class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen text-slate-100"
	>
		<div class="max-w-3xl mx-auto px-4 py-10">
			<header class="text-center mb-8">
				<h1
					class="text-4xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent"
				>
					Timezone Converter
				</h1>
				<p class="text-slate-400 mt-2">
					Type naturally — e.g., "9pm myt to ukt", "7:30pm ET to myt, gmt, pst"
				</p>
			</header>

			<!-- Input -->
			<div
				class="bg-slate-800/60 backdrop-blur rounded-2xl p-6 shadow-xl border border-slate-700"
			>
				<label class="block text-sm font-medium text-slate-300 mb-2"
					>Enter conversion</label
				>
				<input
					id="input"
					type="text"
					placeholder='e.g. "9pm myt to ukt" or "7:30pm ET to myt, gmt, pst"'
					class="w-full bg-slate-900/70 border border-slate-600 rounded-xl px-4 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder:text-slate-500"
					autocomplete="off"
					spellcheck="false"
				/>

				<!-- Quick examples -->
				<div class="mt-3 flex flex-wrap gap-2">
					<span class="text-xs text-slate-500 self-center mr-1">Try:</span>
					<button
						class="example-btn text-xs px-3 py-1 rounded-full bg-slate-700 hover:bg-slate-600 transition"
					>
						9pm myt to ukt
					</button>
					<button
						class="example-btn text-xs px-3 py-1 rounded-full bg-slate-700 hover:bg-slate-600 transition"
					>
						7:30pm ET to myt
					</button>
					<button
						class="example-btn text-xs px-3 py-1 rounded-full bg-slate-700 hover:bg-slate-600 transition"
					>
						7am GMT to MYT
					</button>
					<button
						class="example-btn text-xs px-3 py-1 rounded-full bg-slate-700 hover:bg-slate-600 transition"
					>
						5pm CST to GMT
					</button>
					<button
						class="example-btn text-xs px-3 py-1 rounded-full bg-slate-700 hover:bg-slate-600 transition"
					>
						3pm PST to MYT, GMT, JST
					</button>
				</div>
			</div>

			<!-- Output -->
			<div id="output" class="mt-6"></div>

			<!-- Supported timezones -->
			<details
				class="mt-8 bg-slate-800/40 rounded-xl p-4 border border-slate-700/50"
			>
				<summary class="cursor-pointer text-slate-300 font-medium">
					Supported timezone codes
				</summary>
				<div
					id="tz-list"
					class="mt-3 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2 text-xs text-slate-400"
				></div>
			</details>
		</div>

		<script>
			/* ============================================================
   TIMEZONE DATABASE
   Offsets in hours from UTC. Note: some regional abbreviations
   are ambiguous (e.g., CST = US Central OR China Standard).
   We pick the more common interpretation for this use case.
   ============================================================ */
			const TIMEZONES = {
				// UTC / GMT
				UTC: { offset: 0, name: 'Coordinated Universal Time' },
				GMT: { offset: 0, name: 'Greenwich Mean Time' },
				UKT: { offset: 0, name: 'UK Time (GMT)' }, // UK = GMT (winter); we treat as GMT
				BST: { offset: 1, name: 'British Summer Time' },

				// Europe
				CET: { offset: 1, name: 'Central European Time' },
				CEST: { offset: 2, name: 'Central European Summer Time' },
				EET: { offset: 2, name: 'Eastern European Time' },

				// Americas
				EST: { offset: -5, name: 'Eastern Standard Time (US)' },
				EDT: { offset: -4, name: 'Eastern Daylight Time (US)' },
				ET: { offset: -5, name: 'Eastern Time (US)' },
				CST: { offset: -6, name: 'Central Standard Time (US)' },
				CDT: { offset: -5, name: 'Central Daylight Time (US)' },
				CT: { offset: -6, name: 'Central Time (US)' },
				MST: { offset: -7, name: 'Mountain Standard Time (US)' },
				MDT: { offset: -6, name: 'Mountain Daylight Time (US)' },
				MT: { offset: -7, name: 'Mountain Time (US)' },
				PST: { offset: -8, name: 'Pacific Standard Time (US)' },
				PDT: { offset: -7, name: 'Pacific Daylight Time (US)' },
				PT: { offset: -8, name: 'Pacific Time (US)' },
				AKST: { offset: -9, name: 'Alaska Standard Time' },
				HST: { offset: -10, name: 'Hawaii Standard Time' },

				// Asia
				MYT: { offset: 8, name: 'Malaysia Time' },
				SGT: { offset: 8, name: 'Singapore Time' },
				HKT: { offset: 8, name: 'Hong Kong Time' },
				CSTC: { offset: 8, name: 'China Standard Time' }, // Alias to avoid collision with US CST
				JST: { offset: 9, name: 'Japan Standard Time' },
				KST: { offset: 9, name: 'Korea Standard Time' },
				IST: { offset: 5.5, name: 'India Standard Time' },
				PKT: { offset: 5, name: 'Pakistan Standard Time' },
				GST: { offset: 4, name: 'Gulf Standard Time' },
				ICT: { offset: 7, name: 'Indochina Time' },
				WIB: { offset: 7, name: 'Western Indonesian Time' },

				// Oceania
				AEST: { offset: 10, name: 'Australian Eastern Standard Time' },
				AEDT: { offset: 11, name: 'Australian Eastern Daylight Time' },
				ACST: { offset: 9.5, name: 'Australian Central Standard Time' },
				AWST: { offset: 8, name: 'Australian Western Standard Time' },
				NZST: { offset: 12, name: 'New Zealand Standard Time' },
			}

			/* ============================================================
   PARSING
   Extract: time (hours, minutes, am/pm), source tz, target tz(s)
   ============================================================ */
			function parseInput(raw) {
				if (!raw || !raw.trim()) return null

				// Normalize: collapse spaces, uppercase for tz matching later
				const text = raw.trim().replace(/\s+/g, ' ')

				// Match time: optional minutes, optional am/pm, or 24h
				// Examples: 9pm, 7:30pm, 7am, 15:00, 5:45
				const timeRegex = /\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/i
				const timeMatch = text.match(timeRegex)
				if (!timeMatch)
					return {
						error:
							"Couldn't find a time. Try formats like '9pm' or '7:30pm' or '15:00'.",
					}

				let hours = parseInt(timeMatch[1], 10)
				const minutes = timeMatch[2] ? parseInt(timeMatch[2], 10) : 0
				const meridiem = timeMatch[3] ? timeMatch[3].toLowerCase() : null

				if (minutes < 0 || minutes > 59) return { error: 'Invalid minutes.' }

				if (meridiem === 'pm' && hours < 12) hours += 12
				else if (meridiem === 'am' && hours === 12) hours = 0

				if (hours < 0 || hours > 23) return { error: 'Invalid hour.' }

				// Now find source and target timezones. Split on "to"
				// Take everything after the time for zone parsing
				const afterTime = text.slice(timeMatch.index + timeMatch[0].length)
				const beforeTime = text.slice(0, timeMatch.index)

				// The "from" zone could be right before "to", or right after time.
				// Strategy: find "to" (word boundary, case-insensitive)
				const toIdx = afterTime.toLowerCase().search(/\bto\b/)
				if (toIdx === -1) {
					return {
						error:
							'Missing "to" — format should be "<time> <FROM_TZ> to <TO_TZ>".',
					}
				}

				const fromPart = afterTime.slice(0, toIdx).trim()
				const toPart = afterTime.slice(toIdx + 2).trim()

				// Extract source tz: first tz-looking token in fromPart (or beforeTime as fallback)
				const sourceTz = findFirstTz(fromPart) || findFirstTz(beforeTime)
				if (!sourceTz) return { error: "Couldn't identify source timezone." }

				// Extract target timezones: all tz-looking tokens in toPart
				const targetTzs = findAllTz(toPart)
				if (targetTzs.length === 0)
					return { error: "Couldn't identify target timezone(s)." }

				return { hours, minutes, sourceTz, targetTzs }
			}

			function findFirstTz(str) {
				const tokens = str.toUpperCase().match(/[A-Z]{2,5}/g)
				if (!tokens) return null
				for (const t of tokens) {
					if (resolveTz(t)) return resolveTz(t)
				}
				return null
			}

			function findAllTz(str) {
				const tokens = str.toUpperCase().match(/[A-Z]{2,5}/g)
				if (!tokens) return []
				const found = []
				const seen = new Set()
				for (const t of tokens) {
					const resolved = resolveTz(t)
					if (resolved && !seen.has(resolved)) {
						seen.add(resolved)
						found.push(resolved)
					}
				}
				return found
			}

			// Resolve user-typed code to canonical key in TIMEZONES.
			// Handles aliases and ambiguous codes.
			function resolveTz(code) {
				const c = code.toUpperCase()
				if (TIMEZONES[c]) return c
				// Common aliases
				const aliases = {
					UK: 'UKT',
					US: 'ET',
					EASTERN: 'ET',
					PACIFIC: 'PT',
					CENTRAL: 'CT',
					MOUNTAIN: 'MT',
					MALAYSIA: 'MYT',
					SINGAPORE: 'SGT',
					JAPAN: 'JST',
					KOREA: 'KST',
					INDIA: 'IST',
					CHINA: 'CSTC',
					AUSSIE: 'AEST',
					AUSTRALIA: 'AEST',
				}
				return aliases[c] || null
			}

			/* ============================================================
   CONVERSION
   ============================================================ */
			function convert(hours, minutes, fromTz, toTz) {
				const fromOffset = TIMEZONES[fromTz].offset
				const toOffset = TIMEZONES[toTz].offset

				// Convert source time to UTC minutes
				const sourceMinutes = hours * 60 + minutes
				const utcMinutes = sourceMinutes - fromOffset * 60
				let targetMinutes = utcMinutes + toOffset * 60

				// Normalize into 0..1440 and track day shift
				let dayShift = 0
				while (targetMinutes < 0) {
					targetMinutes += 1440
					dayShift -= 1
				}
				while (targetMinutes >= 1440) {
					targetMinutes -= 1440
					dayShift += 1
				}

				const outH = Math.floor(targetMinutes / 60)
				const outM = targetMinutes % 60

				return { hours: outH, minutes: outM, dayShift }
			}

			/* ============================================================
   FORMATTING
   ============================================================ */
			function formatTime12(h, m) {
				const period = h >= 12 ? 'PM' : 'AM'
				let h12 = h % 12
				if (h12 === 0) h12 = 12
				const mm = m.toString().padStart(2, '0')
				return `${h12}:${mm} ${period}`
			}

			function formatTime24(h, m) {
				return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`
			}

			function formatOffset(offset) {
				if (offset === 0) return 'GMT'
				const sign = offset > 0 ? '+' : '-'
				const abs = Math.abs(offset)
				const whole = Math.floor(abs)
				const frac = abs - whole
				if (frac === 0) return `GMT${sign}${whole}`
				// Handle half-hour zones like IST (5.5)
				const mins = Math.round(frac * 60)
				return `GMT${sign}${whole}:${mins.toString().padStart(2, '0')}`
			}

			function dayLabel(shift) {
				if (shift === 0) return ''
				if (shift === 1)
					return '<span class="ml-2 text-xs px-2 py-0.5 rounded bg-green-500/20 text-green-300">next day</span>'
				if (shift === -1)
					return '<span class="ml-2 text-xs px-2 py-0.5 rounded bg-amber-500/20 text-amber-300">previous day</span>'
				if (shift > 1)
					return `<span class="ml-2 text-xs px-2 py-0.5 rounded bg-green-500/20 text-green-300">+${shift} days</span>`
				return `<span class="ml-2 text-xs px-2 py-0.5 rounded bg-amber-500/20 text-amber-300">${shift} days</span>`
			}

			/* ============================================================
   RENDER
   ============================================================ */
			const outputEl = document.getElementById('output')
			const inputEl = document.getElementById('input')

			function renderError(msg) {
				outputEl.innerHTML = `
    <div class="fade-in bg-red-500/10 border border-red-500/30 rounded-xl p-4 text-red-300">
      <strong>Couldn't parse that.</strong> ${msg}
    </div>`
			}

			function render(parsed) {
				const { hours, minutes, sourceTz, targetTzs } = parsed
				const srcInfo = TIMEZONES[sourceTz]

				const sourceCard = `
    <div class="bg-gradient-to-br from-blue-600/20 to-blue-800/20 border border-blue-500/40 rounded-2xl p-5">
      <div class="flex items-center justify-between mb-1">
        <span class="text-xs uppercase tracking-wider text-blue-300 font-semibold">Source</span>
        <span class="text-xs px-2 py-1 rounded bg-blue-500/20 text-blue-200 font-mono">${formatOffset(srcInfo.offset)}</span>
      </div>
      <div class="text-3xl font-bold mt-2">${formatTime12(hours, minutes)}</div>
      <div class="text-sm text-slate-400 mt-1">${formatTime24(hours, minutes)} · ${sourceTz === 'CSTC' ? 'CST' : sourceTz} — ${srcInfo.name}</div>
    </div>`

				const targetCards = targetTzs
					.map((tz) => {
						const info = TIMEZONES[tz]
						const {
							hours: h,
							minutes: m,
							dayShift,
						} = convert(hours, minutes, sourceTz, tz)
						return `
      <div class="bg-slate-800/70 border border-slate-600/50 rounded-2xl p-5 hover:border-purple-500/40 transition">
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs uppercase tracking-wider text-purple-300 font-semibold">Target</span>
          <span class="text-xs px-2 py-1 rounded bg-purple-500/20 text-purple-200 font-mono">${formatOffset(info.offset)}</span>
        </div>
        <div class="text-3xl font-bold mt-2 flex items-center flex-wrap">
          ${formatTime12(h, m)}
          ${dayLabel(dayShift)}
        </div>
        <div class="text-sm text-slate-400 mt-1">${formatTime24(h, m)} · ${tz === 'CSTC' ? 'CST' : tz} — ${info.name}</div>
      </div>`
					})
					.join('')

				outputEl.innerHTML = `
    <div class="fade-in grid grid-cols-1 md:grid-cols-2 gap-4">
      ${sourceCard}
      ${targetCards}
    </div>`
			}

			function handle() {
				const val = inputEl.value
				if (!val.trim()) {
					outputEl.innerHTML = ''
					return
				}
				const parsed = parseInput(val)
				if (!parsed) {
					outputEl.innerHTML = ''
					return
				}
				if (parsed.error) {
					renderError(parsed.error)
					return
				}
				render(parsed)
			}

			inputEl.addEventListener('input', handle)

			// Example buttons
			document.querySelectorAll('.example-btn').forEach((btn) => {
				btn.addEventListener('click', () => {
					inputEl.value = btn.textContent
					handle()
					inputEl.focus()
				})
			})

			// Populate supported timezones list
			const tzListEl = document.getElementById('tz-list')
			tzListEl.innerHTML = Object.entries(TIMEZONES)
				.sort((a, b) => a[1].offset - b[1].offset)
				.map(([code, info]) => {
					const displayCode = code === 'CSTC' ? 'CST (China)' : code
					return `<div class="font-mono">${displayCode} <span class="text-slate-500">${formatOffset(info.offset)}</span></div>`
				})
				.join('')

			// Auto-focus input
			inputEl.focus()
		</script>
	</body>
</html>
