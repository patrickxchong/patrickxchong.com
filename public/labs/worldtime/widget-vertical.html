<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Time & Weather Widget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Mobile Drag and Drop Polyfill -->
    <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/index.min.js"></script>
    <script>
        MobileDragDrop.polyfill({
            dragImageOffset: { x: 0, y: 0 },
            holdToDrag: 200
        });
    </script>

    <style>
    /* Custom scrollbar - Horizontal support */
    ::-webkit-scrollbar { width: 4px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.4s ease-out forwards; }
    
    .dragging {
        opacity: 0.5;
        transform: scale(0.98);
        border: 2px dashed #64748b;
    }
    /* Changed to border-left for horizontal stacking */
    .drag-over { border-left: 2px solid #38bdf8; }
    .no-select { user-select: none; -webkit-user-select: none; }

    /* Toggle Switch Styling */
    .toggle-checkbox:checked {
        right: 0;
        border-color: #10b981;
    }
    .toggle-checkbox:checked + .toggle-label {
        background-color: #10b981;
    }

    /* Day/Night Themes */
    .theme-day {
        background: linear-gradient(180deg, rgba(56, 189, 248, 0.15) 0%, rgba(30, 58, 138, 0.3) 100%);
        border-top-color: #fbbf24 !important; /* Amber for sun */
    }
    .theme-night {
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.8) 0%, rgba(30, 27, 75, 0.6) 100%);
        border-top-color: #6366f1 !important; /* Indigo for moon */
    }
    
    /* Spinner */
    .loader {
        border: 2px solid #f3f3f3;
        border-top: 2px solid #3498db;
        border-radius: 50%;
        width: 14px;
        height: 14px;
        animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body class="bg-slate-950 text-slate-100 h-dvh w-screen overflow-hidden flex flex-col font-sans transition-colors duration-1000">

    <!-- Header with Controls -->
    <header class="flex-none p-3 sm:p-4 flex flex-wrap gap-y-2 sm:flex-row justify-between items-center z-20 w-full border-b border-slate-800/50 bg-slate-950/80 backdrop-blur-md">
        
        <div class="flex items-center gap-2 sm:gap-4 w-auto justify-between sm:justify-start">
            <h1 class="text-[10px] sm:text-xs font-bold tracking-[0.2em] sm:tracking-[0.3em] uppercase text-slate-500 whitespace-nowrap flex items-center gap-2">
                <span>🌏🕑</span>
            </h1>
            
            <div class="flex items-center gap-2 sm:gap-3">
                 <div class="hidden sm:block w-px h-4 bg-slate-800"></div>
                 <!-- Sort Dashboard Button -->
                 <button onclick="sortDashboard()" class="text-[9px] sm:text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 sm:px-3 sm:py-1.5 rounded transition-colors uppercase tracking-wider font-bold" title="Sort by Longitude (West to East)">
                    Sort Times
                 </button>
                 <button onclick="openAddModal()" class="text-[9px] sm:text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 sm:px-3 sm:py-1.5 rounded transition-colors uppercase tracking-wider font-bold flex items-center gap-1">
                    <span>+ Add</span> <span class="hidden xs:inline">City</span>
                 </button>
            </div>
        </div>

        <!-- Settings Toggles -->
        <div class="flex items-center gap-3 sm:gap-6 w-auto justify-end sm:justify-start">
            
            <!-- 12/24 Hour Toggle -->
            <div class="flex items-center gap-1.5 sm:gap-2">
                <span class="text-[8px] sm:text-[10px] uppercase tracking-wider text-slate-400 font-bold">12h</span>
                <div class="relative inline-block w-8 h-4 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" name="toggle" id="format-toggle" class="toggle-checkbox absolute block w-4 h-4 rounded-full bg-white border-4 appearance-none cursor-pointer transition-all duration-300 left-0 checked:left-4 top-0" checked/>
                    <label for="format-toggle" class="toggle-label block overflow-hidden h-4 rounded-full bg-slate-700 cursor-pointer"></label>
                </div>
                <span class="text-[8px] sm:text-[10px] uppercase tracking-wider text-slate-400 font-bold">24h</span>
            </div>

            <!-- Weather Toggle -->
            <div class="flex items-center gap-1.5 sm:gap-2">
                <span class="text-[8px] sm:text-[10px] uppercase tracking-wider text-slate-400 font-bold">Wx</span>
                <div class="relative inline-block w-8 h-4 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" name="weather-toggle" id="weather-toggle" class="toggle-checkbox absolute block w-4 h-4 rounded-full bg-white border-4 appearance-none cursor-pointer transition-all duration-300 left-0 checked:left-4 top-0"/>
                    <label for="weather-toggle" class="toggle-label block overflow-hidden h-4 rounded-full bg-slate-700 cursor-pointer"></label>
                </div>
            </div>

        </div>
    </header>

    <!-- Main Widget Container -->
    <!-- Changed: overflow-x-auto for horizontal scrolling -->
    <main class="flex-grow w-full h-full relative overflow-hidden flex flex-col justify-center">
        
        <!-- Ambient Background -->
        <div class="fixed top-0 left-0 w-full h-full -z-0 pointer-events-none transition-colors duration-1000">
            <div class="absolute top-0 left-0 w-full h-full bg-slate-950"></div>
            <!-- Orbs -->
            <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-indigo-900/20 rounded-full blur-[120px] transition-colors duration-1000" id="orb-1"></div>
            <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-emerald-900/10 rounded-full blur-[120px] transition-colors duration-1000" id="orb-2"></div>
        </div>

        <!-- Horizontal Flex Layout -->
        <!-- Changed: Removed gap, added px-0 to let cards touch or be very close -->
        <div id="clock-grid" class="flex flex-row items-stretch h-full w-full overflow-x-auto overflow-y-hidden snap-x snap-mandatory scroll-smooth pb-0">
            <!-- Clock cards injected here -->
        </div>

    </main>

    <footer class="flex-none p-2 text-center text-[10px] text-slate-700 z-10 hidden sm:block border-t border-slate-900 bg-slate-950">
        Local Reference: <span id="local-time-ref">--</span>
    </footer>

    <!-- Add Location Modal -->
    <div id="add-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-lg p-6 w-full max-w-sm shadow-2xl relative">
            <h2 class="text-lg font-bold text-slate-200 mb-4">Add Location</h2>
            
            <form id="add-form" class="space-y-4">
                <!-- Search City Section -->
                <div>
                    <label class="block text-xs text-slate-400 mb-1">City Name</label>
                    <div class="flex gap-2">
                        <input type="text" id="input-city" class="flex-1 bg-slate-800 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none focus:border-blue-500" placeholder="e.g. Tokyo" required>
                        <button type="button" onclick="autoDetectCity()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 rounded text-xs font-bold border border-slate-600 transition-colors flex items-center justify-center min-w-[60px]" id="search-btn">
                            Search
                        </button>
                    </div>
                    <p class="text-[10px] text-slate-500 mt-1" id="search-status">Enter city & click search to auto-fill.</p>
                </div>
                
                <div>
                    <div class="flex justify-between items-end mb-1">
                        <label class="block text-xs text-slate-400">Timezone</label>
                    </div>
                    <select id="input-timezone" class="w-full bg-slate-800 border border-slate-600 rounded p-2 text-xs text-white focus:outline-none focus:border-blue-500">
                        <!-- Populated by JS -->
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] text-slate-500 mb-1">Lat</label>
                        <input type="number" step="any" id="input-lat" class="w-full bg-slate-800 border border-slate-600 rounded p-2 text-xs text-white focus:outline-none focus:border-blue-500" placeholder="0.00" readonly>
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-500 mb-1">Lng</label>
                        <input type="number" step="any" id="input-lng" class="w-full bg-slate-800 border border-slate-600 rounded p-2 text-xs text-white focus:outline-none focus:border-blue-500" placeholder="0.00" readonly>
                    </div>
                </div>

                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="closeAddModal()" class="px-3 py-1.5 text-xs text-slate-400 hover:text-white transition-colors">Cancel</button>
                    <button type="submit" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded transition-colors">Add Widget</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION & STATE
        // ==========================================
        const defaultLocations = [
            { label: 'California',   zone: 'America/Los_Angeles', lat: 34.05, lng: -118.24 }, // West
            { label: 'New York',     zone: 'America/New_York',  lat: 40.71, lng: -74.00 },
            { label: 'London',       zone: 'Europe/London',     lat: 51.50, lng: -0.12 },
            { label: 'Kuala Lumpur', zone: 'Asia/Kuala_Lumpur', lat: 3.14, lng: 101.69 },
            { label: 'Japan',        zone: 'Asia/Tokyo',        lat: 35.67, lng: 139.65 },
            { label: 'Sydney',       zone: 'Australia/Sydney',  lat: -33.86, lng: 151.20 } // East
        ];

        // Available Timezones
        const availableTimezones = Intl.supportedValuesOf('timeZone');

        let locations = [];
        let is24Hour = true;
        let showWeather = false;
        let draggedItem = null;

        const container = document.getElementById('clock-grid');
        const localRef = document.getElementById('local-time-ref');
        const formatToggle = document.getElementById('format-toggle');
        const weatherToggle = document.getElementById('weather-toggle');
        const modal = document.getElementById('add-modal');
        const timezoneSelect = document.getElementById('input-timezone');

        // ==========================================
        // INITIALIZATION
        // ==========================================
        function init() {
            // Load State
            const storedLocs = localStorage.getItem('clock-locations');
            const storedFormat = localStorage.getItem('clock-is24h');
            const storedWeather = localStorage.getItem('clock-weather');

            locations = storedLocs ? JSON.parse(storedLocs) : defaultLocations;
            
            // Initial Sort by Map (Longitude) if not manually reordered recently? 
            // We'll trust the stored order, but if it's default, it should be sorted.
            if (!storedLocs) {
                sortDashboard(false); // Sort initial load without animation
            }

            if (storedFormat !== null) {
                is24Hour = JSON.parse(storedFormat);
                formatToggle.checked = is24Hour;
            }
            if (storedWeather !== null) {
                showWeather = JSON.parse(storedWeather);
                weatherToggle.checked = showWeather;
            }

            // Populate Timezones (Default order)
            renderTimezoneOptions(availableTimezones);
            
            // Set default timezone to local guess
            try {
                timezoneSelect.value = Intl.DateTimeFormat().resolvedOptions().timeZone;
            } catch(e) {}

            renderCards();
            
            // Listeners
            formatToggle.addEventListener('change', (e) => {
                is24Hour = e.target.checked;
                saveState();
                updateTime();
            });

            weatherToggle.addEventListener('change', (e) => {
                showWeather = e.target.checked;
                saveState();
                toggleWeatherDisplay();
                if(showWeather) fetchWeatherData();
            });

            document.getElementById('add-form').addEventListener('submit', handleAddLocation);

            setupDragAndDrop();
            updateTime();
            setInterval(updateTime, 1000);
            
            if(showWeather) fetchWeatherData();
            setInterval(() => { if(showWeather) fetchWeatherData(); }, 900000); 
        }

        // ==========================================
        // AUTO-DETECT / GEOCODING
        // ==========================================
        async function autoDetectCity() {
            const cityInput = document.getElementById('input-city');
            const statusEl = document.getElementById('search-status');
            const btn = document.getElementById('search-btn');
            const query = cityInput.value.trim();

            if (!query) {
                statusEl.textContent = "Please enter a city name first.";
                statusEl.className = "text-[10px] text-red-400 mt-1";
                return;
            }

            // UI Loading state
            const originalBtnText = btn.innerHTML;
            btn.innerHTML = `<div class="loader"></div>`;
            statusEl.textContent = "Searching...";
            statusEl.className = "text-[10px] text-blue-400 mt-1";

            try {
                // Open-Meteo Geocoding API
                const response = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en&format=json`);
                const data = await response.json();

                if (data.results && data.results.length > 0) {
                    const place = data.results[0];
                    
                    // Fill Fields
                    document.getElementById('input-lat').value = place.latitude;
                    document.getElementById('input-lng').value = place.longitude;
                    
                    // Set Timezone
                    if (place.timezone) {
                        timezoneSelect.value = place.timezone;
                    }
                    
                    // Update Status
                    statusEl.innerHTML = `<span class="text-green-400">Found: ${place.name}, ${place.country}</span>`;
                    cityInput.value = place.name; // Correct capitalization
                } else {
                    statusEl.textContent = "City not found. Try checking spelling.";
                    statusEl.className = "text-[10px] text-red-400 mt-1";
                }
            } catch (error) {
                console.error(error);
                statusEl.textContent = "Error fetching data.";
                statusEl.className = "text-[10px] text-red-400 mt-1";
            } finally {
                btn.innerHTML = originalBtnText;
            }
        }

        // ==========================================
        // SORTING: Map Based (West to East)
        // ==========================================
        function sortDashboard(animate = true) {
            
            locations.sort((a, b) => {
                // Sort by Longitude (-180 West -> +180 East)
                return a.lng - b.lng;
            });
            
            saveState();
            renderCards();
            setupDragAndDrop();
        }

        function renderTimezoneOptions(zones) {
            timezoneSelect.innerHTML = '';
            zones.forEach(tz => {
                const opt = document.createElement('option');
                opt.value = tz;
                opt.textContent = tz;
                timezoneSelect.appendChild(opt);
            });
        }

        // ==========================================
        // CORE FUNCTIONS
        // ==========================================
        function saveState() {
            localStorage.setItem('clock-locations', JSON.stringify(locations));
            localStorage.setItem('clock-is24h', JSON.stringify(is24Hour));
            localStorage.setItem('clock-weather', JSON.stringify(showWeather));
        }

        function renderCards() {
            container.innerHTML = '';
            locations.forEach((loc, index) => {
                container.appendChild(createCard(loc, index));
            });
            toggleWeatherDisplay(); 
            if (showWeather) fetchWeatherData();
        }

        function createCard(loc, index) {
            const card = document.createElement('div');
            card.setAttribute('draggable', 'true');
            card.setAttribute('data-zone', loc.zone);
            card.setAttribute('data-lat', loc.lat || 0);
            card.setAttribute('data-lng', loc.lng || 0);
            card.setAttribute('data-index', index);
            card.id = `card-${index}`;
            
            // CHANGED: Compact Vertical Strip Layout
            // flex-1: Grows to fill space
            // min-w-[...]: Ensures it doesn't get too squished
            card.className = `
                relative group flex-1 max-w-[14rem]
                flex flex-col items-center justify-between
                bg-slate-900/40 backdrop-blur-sm border-t-[4px] border-slate-700
                border-r border-white/5 first:border-l
                cursor-grab active:cursor-grabbing no-select fade-in
                h-full snap-start hover:bg-slate-800/60 transition-all duration-300
            `;
            card.style.animationDelay = `${index * 50}ms`;

            card.innerHTML = `
                <!-- Controls (Hidden unless hovered) -->
                <div class="absolute top-1 right-1 z-20 opacity-0 group-hover:opacity-100 transition-opacity">
                    <button onclick="removeLocation(${index})" class="text-slate-600 hover:text-red-400 p-1">
                        <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
                        </svg>
                    </button>
                </div>

                <div class="text-center w-full relative z-10 pointer-events-none flex flex-col items-center justify-between h-full py-4">
                    
                    <!-- Top: Weather & Day/Night -->
                    <div class="flex flex-col items-center gap-1">
                        <h2 class="text-[10px] h-6 sm:text-xs font-bold tracking-wider text-slate-200 uppercase text-center break-words w-full px-1 leading-snug">
                            ${loc.label}
                        </h2>

                        <div class="day-night-icon text-xl sm:text-2xl mb-1"></div>
                        
                         <!-- Weather Badge (Simplified for Compact) -->
                         <div class="weather-badge hidden relative group/weather opacity-0 transition-opacity duration-500 pointer-events-auto">
                            <div class="text-slate-300 text-[10px] font-bold flex flex-col items-center leading-tight">
                                <span class="weather-temp">--</span>
                                <span class="weather-icon text-sm"></span>
                            </div>
                         </div>
                    </div>
                    
                    <!-- Middle: Stacked Time -->
                    <div class="time-container font-mono text-white leading-none flex flex-col items-center justify-center gap-1 my-auto">
                        <!-- Time injected here -->
                    </div>
                    <span class="text-[9px] text-slate-300 font-medium tracking-wide date-display uppercase">--</span>

                    <!-- Bottom: City Info -->
                    <div class="text-[8px] text-slate-600 uppercase tracking-widest transform scale-90 h-4">
                        ${loc.zone.split('/')[1]?.replace('_', ' ') || 'Zone'}
                    </div>
                </div>
            `;
            return card;
        }

        function updateTime() {
            const now = new Date();
            if(localRef) localRef.textContent = now.toLocaleTimeString([], { hour12: !is24Hour, hour: '2-digit', minute: '2-digit', timeZoneName: 'short' });

            Array.from(container.children).forEach((card) => {
                const zone = card.getAttribute('data-zone');
                const timeWrap = card.querySelector('.time-container');
                const dateEl = card.querySelector('.date-display');
                
                // Formatter
                const formatter = new Intl.DateTimeFormat('en-US', {
                    hour: '2-digit', minute: '2-digit', second: '2-digit',
                    hour12: !is24Hour, timeZone: zone
                });
                const dateString = new Intl.DateTimeFormat('en-US', {
                    weekday: 'short', day: 'numeric', timeZone: zone
                }).format(now);

                // Day/Night Logic
                const hourFormatter = new Intl.DateTimeFormat('en-US', {
                    hour: 'numeric', hour12: false, timeZone: zone
                });
                const remoteHour = parseInt(hourFormatter.format(now));
                const isDay = remoteHour >= 6 && remoteHour < 18;
                
                if (!showWeather || card.getAttribute('data-weather-loaded') !== 'true') {
                   setCardTheme(card, isDay);
                }

                // Render Time
                const parts = formatter.formatToParts(now);
                const getPart = (type) => parts.find(p => p.type === type)?.value || '';
                const ampm = getPart('dayPeriod'); 
                const hour = getPart('hour');
                const minute = getPart('minute');
                const second = getPart('second');

                // COMPACT STACKED LAYOUT
                // Hour on top, Minute below
                let html = ``;
                
                // Hour Block
                html += `<div class="flex flex-col items-center justify-center">`;
                html += `<span class="text-4xl sm:text-6xl font-bold tracking-tighter text-white drop-shadow-xl">${hour}</span>`;
                
                // Separator / AM/PM
                html += `<div class="h-px w-full bg-white/10 my-1"></div>`;
                
                // Minute Block
                html += `<span class="text-4xl sm:text-6xl font-normal tracking-tighter text-slate-300 drop-shadow-lg">${minute}</span>`;
                html += `</div>`;

                // Seconds & AM/PM (Tiny)
                html += `<div class="flex items-center gap-1 mt-2">`;
                html += `<span class="text-[10px] text-slate-500 font-mono">${second}</span>`;
                if (!is24Hour && ampm) {
                    html += `<span class="text-[9px] text-amber-500 font-bold uppercase">${ampm}</span>`;
                }
                html += `</div>`;

                timeWrap.innerHTML = html;
                if(dateEl) dateEl.textContent = dateString;
            });
        }

        function setCardTheme(card, isDay) {
            const iconEl = card.querySelector('.day-night-icon');
            if(isDay) {
                card.classList.remove('theme-night');
                card.classList.add('theme-day');
                iconEl.textContent = '☀️';
                iconEl.classList.add('text-amber-400');
                iconEl.classList.remove('text-indigo-400');
            } else {
                card.classList.remove('theme-day');
                card.classList.add('theme-night');
                iconEl.textContent = '🌙';
                iconEl.classList.add('text-indigo-400');
                iconEl.classList.remove('text-amber-400');
            }
        }

        // ==========================================
        // WEATHER
        // ==========================================
        function toggleWeatherDisplay() {
            const badges = document.querySelectorAll('.weather-badge');
            badges.forEach(badge => {
                if(showWeather) {
                    badge.classList.remove('hidden');
                    setTimeout(() => badge.classList.remove('opacity-0'), 10);
                } else {
                    badge.classList.add('opacity-0');
                    setTimeout(() => badge.classList.add('hidden'), 300);
                }
            });
        }

        function getWeatherEmoji(code, isDay) {
            if (code === 0) return isDay ? '☀️' : '🌙'; 
            if (code >= 1 && code <= 3) return isDay ? '⛅' : '☁️'; 
            if (code >= 45 && code <= 48) return '🌫️'; 
            if (code >= 51 && code <= 67) return '🌧️'; 
            if (code >= 71 && code <= 77) return '❄️'; 
            if (code >= 80 && code <= 82) return '🌦️'; 
            if (code >= 85 && code <= 86) return '❄️'; 
            if (code >= 95) return '⛈️'; 
            return '🌡️';
        }

        async function fetchWeatherData() {
            const cards = Array.from(container.children);
            
            cards.forEach(async (card) => {
                const lat = card.getAttribute('data-lat');
                const lng = card.getAttribute('data-lng');
                const zone = card.getAttribute('data-zone');
                
                if (!lat || !lng || lat == 0 || lng == 0) return;

                const tempEl = card.querySelector('.weather-temp');
                const iconEl = card.querySelector('.weather-icon');

                try {
                    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true&hourly=relativehumidity_2m&timezone=${zone}`;
                    const response = await fetch(url);
                    const data = await response.json();
                    
                    if (data.current_weather) {
                        const temp = Math.round(data.current_weather.temperature);
                        const code = data.current_weather.weathercode;
                        const isDay = data.current_weather.is_day === 1; 
                        const wind = data.current_weather.windspeed;
                        const hourOfDay = new Date().getHours(); 
                        const hum = data.hourly.relativehumidity_2m[hourOfDay] || '--';

                        tempEl.textContent = `${temp}°C`;
                        iconEl.textContent = getWeatherEmoji(code, isDay);
                        
                        card.setAttribute('data-weather-loaded', 'true');
                        setCardTheme(card, isDay);
                    }
                } catch (e) {
                    console.error("Weather fetch failed", e);
                }
            });
        }

        // ==========================================
        // ADD / REMOVE
        // ==========================================
        function openAddModal() {
            modal.classList.remove('hidden');
        }
        function closeAddModal() {
            modal.classList.add('hidden');
            document.getElementById('add-form').reset();
            document.getElementById('search-status').textContent = "Enter city & click search to auto-fill.";
            document.getElementById('search-status').className = "text-[10px] text-slate-500 mt-1";
        }
        
        function handleAddLocation(e) {
            e.preventDefault();
            const city = document.getElementById('input-city').value;
            const zone = document.getElementById('input-timezone').value;
            const lat = parseFloat(document.getElementById('input-lat').value) || 0;
            const lng = parseFloat(document.getElementById('input-lng').value) || 0;

            locations.push({ label: city, zone: zone, lat: lat, lng: lng });
            saveState();
            renderCards();
            setupDragAndDrop();
            closeAddModal();
        }

        window.removeLocation = function(index) {
            locations.splice(index, 1);
            saveState();
            renderCards();
            setupDragAndDrop();
        };

        // ==========================================
        // DRAG AND DROP
        // ==========================================
        function setupDragAndDrop() {
            const cards = container.querySelectorAll('[draggable="true"]');
            cards.forEach(card => {
                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragend', handleDragEnd);
                card.addEventListener('dragenter', handleDragEnter);
                card.addEventListener('dragleave', handleDragLeave);
            });
            container.addEventListener('dragover', handleDragOver);
            container.addEventListener('drop', handleDrop);
        }

        function handleDragStart(e) {
            draggedItem = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', this.innerHTML);
        }
        function handleDragEnd(e) {
            this.classList.remove('dragging');
            container.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
            draggedItem = null;
            
            const reorderedLocations = [];
            Array.from(container.children).forEach(card => {
                reorderedLocations.push({
                    label: card.querySelector('h2').textContent.replace(/☀️|🌙/g, '').trim(),
                    zone: card.getAttribute('data-zone'),
                    lat: parseFloat(card.getAttribute('data-lat')),
                    lng: parseFloat(card.getAttribute('data-lng'))
                });
            });
            locations = reorderedLocations;
            saveState();
            renderCards(); 
            setupDragAndDrop();
        }
        function handleDragOver(e) { e.preventDefault(); return false; }
        function handleDragEnter(e) {}
        function handleDragLeave(e) {}
        function handleDrop(e) {
            e.stopPropagation();
            if (draggedItem !== this) {
                const target = e.target.closest('[draggable="true"]');
                if (target && target !== draggedItem) {
                    const allItems = [...container.children];
                    const draggedIdx = allItems.indexOf(draggedItem);
                    const targetIdx = allItems.indexOf(target);
                    if (draggedIdx < targetIdx) target.after(draggedItem);
                    else target.before(draggedItem);
                }
            }
            return false;
        }

        init();
    </script>
</body>
</html>
