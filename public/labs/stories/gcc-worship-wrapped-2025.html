    function parseCSV(csv) {
        const lines = csv.trim().split('\n');
        return lines.slice(1).map(line => {
            const parts = [];
            let current = '';
            let inQuote = false;
            for (let char of line) {
                if (char === '"') inQuote = !inQuote;
                else if (char === ',' && !inQuote) { parts.push(current.trim()); current = ''; }
                else current += char;
            }
            parts.push(current.trim());
            return parts;
        });
    }

        // 6. TOP SONG (UPDATED)

            duration: 6000,
            render: () => `
                 <div class="absolute inset-0 bg-[#121212]"></div>

                                    </div>

                                </div>
                            ${top5.map((song, i) => `
                                <div class="flex justify-between items-start">

                        <div class="mt-6 pt-4 border-t-2 border-black border-dashed flex justify-between font-bold">

        },
        // 8. DECEMBER (Holiday)
        {
            id: 'december',
            theme: 'dark',
            duration: 6000,
            bgColor: '#1a472a',
            render: () => `
                <div class="absolute inset-0 bg-gradient-to-b from-[#0f3d0f] to-[#0f3d0f]"></div>
                ${Array(20).fill(0).map((_, i) => `<div class="absolute text-white opacity-20 animate-float" style="left:${Math.random()*100}%; top:${Math.random()*100}%; font-size:${10+Math.random()*20}px; animation-duration:${3+Math.random()*5}s">❄</div>`).join('')}
                
                <div class="flex flex-col justify-center h-full px-8 z-10 relative text-center">

                    <div class="bg-black/30 backdrop-blur-md rounded-xl p-6 border border-white/10 text-left opacity-0 animate-slide-up" style="animation-delay: 0.2s">
                         ${decUnique.map((song, i) => `

        // 8. OUTRO
        {

                    <div class="w-full bg-[#E91429] p-6 text-center transform rotate-2 border-4 border-black cover-art-shadow opacity-0 animate-pop-in relative">

                            <div>
                                <div class="text-[10px] text-gray-500 font-bold uppercase">Total Minutes</div>
                                <div class="font-black text-3xl text-sp-pink">${Math.floor(totalMinutes).toLocaleString()}</div>

                        <div class="absolute -bottom-12 right-0 font-marker text-white text-xl transform -rotate-6 opacity-80">
                            #GCCWorshipWrapped
                        </div>
                    </div>

                    <div class="mt-16 flex flex-col gap-4 w-full px-8 relative z-[60]">
                        <button onclick="showSlide(0)" class="bg-white text-black py-4 rounded-full font-bold text-lg hover:scale-105 transition-transform uppercase tracking-widest shadow-lg border-2 border-black cursor-pointer pointer-events-auto">
                            Replay ↻

    ];

    // --- ENGINE ---
    let currentSlideIndex = 0;
    let timer = null;
    const container = document.getElementById('slides-container');
    const progressContainer = document.getElementById('progress-container');
    const app = document.getElementById('app');

    function init() {
        progressContainer.innerHTML = slides.map((_, idx) => `
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="bar-${idx}"></div>
            </div>
        `).join('');
        showSlide(0);
    }

    function showSlide(index) {
        if (index >= slides.length) return; 
        if (index < 0) return;

        currentSlideIndex = index;
        const slideData = slides[index];
        app.style.backgroundColor = slideData.bgColor;
        app.className = `story-container ${slideData.themeClass}`;
        container.innerHTML = `<div class="slide active">${slideData.render()}</div>`;

        // Handle Navigation Overlay Interactivity
        const navOverlay = document.getElementById('nav-overlay');
        if (navOverlay) {
            // On the last slide, disable the ENTIRE overlay so the full-width Replay button is clickable
            // On other slides, enable it for navigation
            navOverlay.style.pointerEvents = (index === slides.length - 1) ? 'none' : 'auto';
        }

        slides.forEach((_, idx) => {
            const bar = document.getElementById(`bar-${idx}`);
            bar.style.transition = 'none';
            bar.style.width = '0%';
            
            if (idx < index) {
                bar.style.width = '100%';
            } 
            else if (idx === index) {
                if (slideData.duration > 0) {
                    void bar.offsetWidth;
                    bar.style.transition = `width ${slideData.duration}ms linear`;
                    bar.style.width = '100%';
                } else if (index === slides.length - 1) {
                    // Final slide: fill immediately
                    bar.style.width = '100%';
                }
            }
        });

        if (timer) clearTimeout(timer);
        if (slideData.duration > 0) {
            timer = setTimeout(() => nextSlide(), slideData.duration);
        }
    }

    function nextSlide() {
        if (currentSlideIndex < slides.length - 1) showSlide(currentSlideIndex + 1);
    }

    function prevSlide() {
        if (currentSlideIndex > 0) showSlide(currentSlideIndex - 1);
        else showSlide(0);
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
        if (e.key === 'ArrowLeft') prevSlide();
    });

    init();

</script>
